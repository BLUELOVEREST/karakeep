name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-apk/v[0-9]+.[0-9]+.[0-9]+-eric.[0-9]+"
      - "android-release-apk/v[0-9]+.[0-9]+.[0-9]+-eric.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      APP_VARIANT: ${{ startsWith(github.ref_name, 'android-release-apk/') && 'production' || 'development' }}
      ARTIFACT_BASENAME: ${{ startsWith(github.ref_name, 'android-release-apk/') && 'karakeep-mobile-arm64-v8a' || 'karakeep-mobile-dev-arm64-v8a' }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=8192
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - name: Setup repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Generate Android project
        run: pnpm --filter @karakeep/mobile exec expo prebuild --platform android --no-install

      - name: Configure release signing
        if: startsWith(github.ref_name, 'android-release-apk/')
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > app/release.keystore
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()
          text = text.replace(
              "    signingConfigs {\n        debug {",
              """    signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
                  debug {""",
              1,
          )
          text = text.replace(
              "            signingConfig signingConfigs.debug\n"
              "            def enableShrinkResources",
              "            signingConfig signingConfigs.release\n"
              "            def enableShrinkResources",
              1,
          )
          path.write_text(text)
          PY

      - name: Limit APK to arm64-v8a
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          sed -i \
            's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' \
            gradle.properties

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-parallel

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/${ARTIFACT_BASENAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: artifacts/${{ env.ARTIFACT_BASENAME }}.apk
          if-no-files-found: error
