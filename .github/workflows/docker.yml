name: Build and Push Eric Karakeep AIO

on:
  workflow_dispatch:
  push:
    tags:
      - "eric/v[0-9]+.[0-9]+.[0-9]+-eric.[0-9]+"

jobs:
  build-aio:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    env:
      APT_MIRROR: http://mirrors.tuna.tsinghua.edu.cn/debian
      APT_SECURITY_MIRROR: http://mirrors.tuna.tsinghua.edu.cn/debian-security
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

    steps:
      - name: Setup repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Github Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_GITHUB_PAT || github.token }}

      - name: Prepare image metadata
        id: meta
        run: |
          set -euo pipefail
          version_tag=$(echo "${GITHUB_REF_NAME}" | sed -E 's#^eric/##')
          safe_ref=$(echo "${version_tag}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "version=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/karakeep-aio" >> "$GITHUB_OUTPUT"
          echo "tag=${safe_ref}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push AIO
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          build-args: |
            SERVER_VERSION=${{ steps.meta.outputs.version }}
            APT_MIRROR=${{ env.APT_MIRROR }}
            APT_SECURITY_MIRROR=${{ env.APT_SECURITY_MIRROR }}
            NPM_CONFIG_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=aio-amd64
          cache-to: type=gha,mode=max,scope=aio-amd64
